services:
  web:
    build:
      context: ../apps/visit-counter
      dockerfile: Dockerfile.optimized
    ports:
      - "127.0.0.1:${APP_PORT:-5050}:5000"
    environment:
      MESSAGE: ${MESSAGE:-Docker capstone complete}
      REDIS_HOST: cache
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
